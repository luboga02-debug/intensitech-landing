<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062E45"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="none" stroke="#00BCD4" stroke-width="8" opacity="0.3"/>
  <!-- Cross -->
  <path d="M226 120 h60 v90 h90 v60 h-90 v120 h-60 v-120 h-90 v-60 h90 z" fill="#0D4A6B" opacity="0.6"/>
  <!-- Pulse / ECG Wave -->
  <path d="M80 270 L170 270 L195 210 L230 350 L275 160 L315 310 L345 250 L370 270 L432 270" 
        fill="none" stroke="url(#teal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Heart Accent -->
  <circle cx="275" cy="160" r="14" fill="#00E5FF"/>
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" font-weight="900" fill="#E8F4F8" text-anchor="middle" letter-spacing="4">VASOACTIVOS</text>
</svg>
